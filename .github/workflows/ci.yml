name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oraviq
          POSTGRES_PASSWORD: oraviq
          POSTGRES_DB: oraviq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oraviq" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://oraviq:oraviq@localhost:5432/oraviq_test
      TEST_DATABASE_URL: postgresql://oraviq:oraviq@localhost:5432/oraviq_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      INLINE_JOBS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oraviq/api db:generate
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
