# Local Postgres and Redis for development: docker compose up -d
services:
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: oraviq
      POSTGRES_PASSWORD: oraviq
      POSTGRES_DB: oraviq
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
volumes:
  postgres_data:
  redis_data:
